# Candidate companies to check with scripts/verify_companies.py.
#
# This is NOT the active polling list (that's config/companies.yaml) --
# it's a queue of names worth checking. Run:
#
#   python scripts/verify_companies.py
#
# The script tries several slug variants for each candidate against the
# Greenhouse/Lever/Ashby public APIs and prints which ones actually resolve
# to a real job board. Pass --append to have it write confirmed matches
# straight into config/companies.yaml.
#
# Many India/France startups do NOT use Greenhouse/Lever/Ashby at all --
# they use Workday, SmartRecruiters, Welcome to the Jungle (common in
# France), or a custom careers page. Those won't verify here; they'd need
# a dedicated Tier 2 (RSS) or Tier 3 (scrape/email) source instead. This
# list intentionally omits board/slug guesses -- only the verifier's
# confirmed hits are worth trusting.
#
# Add names as you find them (YC directory, Tracxn/Crunchbase lists,
# LinkedIn "Companies" search, news coverage, VC portfolio pages, etc.)
# -- this file is meant to grow over time.

