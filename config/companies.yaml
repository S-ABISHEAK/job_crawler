# Tier 1 company seed list for Greenhouse / Lever / Ashby public job-board APIs.
#
# Adding a company = one entry here. No code changes needed.
#
#   board: greenhouse | lever | ashby
#   slug:  the identifier used in that board's public API URL, e.g.
#     Greenhouse: https://boards-api.greenhouse.io/v1/boards/{slug}/jobs
#     Lever:      https://api.lever.co/v0/postings/{slug}
#     Ashby:      https://api.ashbyhq.com/posting-api/job-board/{slug}
#
# HOW TO FIND A COMPANY'S REAL SLUG (slugs below are best-effort and may
# have drifted -- verify before relying on them):
#   1. Open the company's public "Careers" page and look at the URL --
#      Greenhouse/Lever/Ashby-hosted boards usually embed the slug directly
#      (e.g. jobs.lever.co/{slug}, boards.greenhouse.io/{slug},
#      jobs.ashbyhq.com/{slug}).
#   2. Or just hit the API URL pattern above with your guess and see if it
#      returns JSON instead of a 404.
#   3. Run `python -m app.ingest.verify_companies` (see README) to check
#      every entry in this file at once and flag dead slugs.
#
# This seed list favors AI-native / LLM startups most likely to have
# fresher/intern-friendly AI engineering roles. Swap or extend freely --
# it is a starting point, not a verified-live list.

companies:
